<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Sticky Navbar and Card Overlay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This page demonstrates sticky navigation and card overlay.</p>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"
                 alt="Laptop on desk">

            <div class="overlay">
                <h3>Web Development</h3>
                <p>Learn HTML and CSS</p>
            </div>
        </div>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>I am a Computer Science and AI student interested in web development.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@gmail.com</p>
    </section>

</body>
</html>
