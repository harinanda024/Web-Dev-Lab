<!DOCTYPE html>
<html>
<head>
    <title>Newspaper Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Daily News</h1>
        <p>Your Daily Newspaper</p>
    </header>

    <main class="container">

        <section class="news">
            <h2>Technology</h2>
            <p>Technology is changing the world.
            New inventions are making our lives easier.</p>
        </section>

        <section class="news">
            <h2>Education</h2>

            and develop new skills.</p>

        <section class="news">
            <h2>Sports</h2>

            and improve teamwork.</p>
        </section>

    </main>

    <footer>
        <p>Copyright 2026 Daily News</p>
    </footer>

</body>
</html>
